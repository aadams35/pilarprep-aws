AWSTemplateFormatVersion: "2010-09-09"
Description: PilarPrep static frontend hosted on S3 and CloudFront

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Workload identity
        Parameters:
          - ResourcePrefix
          - ProjectName
          - EnvironmentName
          - Owner
          - CostCenter
      - Label:
          default: Frontend hosting
        Parameters:
          - FrontendBucketName
          - WebACLId
          - CloudFrontPriceClass

Parameters:
  WebACLId:
    Type: String
    Default: ""
    Description: Optional existing AWS WAF web ACL ARN to keep attached to CloudFront.
  CloudFrontPriceClass:
    Type: String
    Default: ""
    Description: Optional CloudFront price class. Leave empty when using the CloudFront free pricing plan.
    AllowedValues:
      - ""
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
  ResourcePrefix:
    Type: String
    Default: pillarprep-demo
    Description: Lowercase prefix used for safe display names and Name tags.
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,40}$"
  ProjectName:
    Type: String
    Default: PilarPrep
  EnvironmentName:
    Type: String
    Default: demo
  Owner:
    Type: String
    Default: austin-adams
  CostCenter:
    Type: String
    Default: hackathon
  FrontendBucketName:
    Type: String
    Description: Globally unique S3 bucket name for static frontend assets.
  CustomDomainName:
    Type: String
    Default: ""
    Description: Optional HTTPS custom domain served by this distribution.
  AcmCertificateArn:
    Type: String
    Default: ""
    Description: Optional us-east-1 ACM certificate ARN for the custom domain.
  JobsApiOriginDomainName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9.-]+$"
    Description: Optional API Gateway origin domain without scheme or path.
  ApiOriginVerificationSecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN shared by CloudFront and the Jobs API.
  CognitoLoginDomainName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9.-]+$"
    Description: Cognito hosted-login domain without scheme or path.



Conditions:
  HasWebAcl: !Not [!Equals [!Ref WebACLId, ""]]
  CreateManagedWebAcl: !Equals [!Ref WebACLId, ""]
  HasPriceClass: !Not [!Equals [!Ref CloudFrontPriceClass, ""]]
  HasCustomDomain: !And
    - !Not [!Equals [!Ref CustomDomainName, ""]]
    - !Not [!Equals [!Ref AcmCertificateArn, ""]]
  HasApiOrigin: !And
    - !Not [!Equals [!Ref JobsApiOriginDomainName, ""]]
    - !Not [!Equals [!Ref ApiOriginVerificationSecretArn, ""]]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref FrontendBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-web-assets"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Application
          Value: sa-briefing-generator
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation
        - Key: Repository
          Value: aadams35/pilarprep-aws
        - Key: DataClassification
          Value: demo

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ResourcePrefix}-frontend-oac"
        Description: PilarPrep frontend S3 origin access control
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  ManagedDemoWebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: CreateManagedWebAcl
    Properties:
      Name: !Sub "${ResourcePrefix}-cloudfront-waf"
      Description: Rate limits the public PilarPrep demo and observes common threats.
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${ResourcePrefix}-cloudfront-waf"
        SampledRequestsEnabled: true
      Rules:
        - Name: RateLimitPublicDemo
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: 100
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ResourcePrefix}-rate-limit"
            SampledRequestsEnabled: true
        - Name: ObserveIpReputation
          Priority: 1
          OverrideAction:
            Count: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ResourcePrefix}-ip-reputation"
            SampledRequestsEnabled: true
        - Name: ObserveCommonThreats
          Priority: 2
          OverrideAction:
            Count: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ResourcePrefix}-common-threats"
            SampledRequestsEnabled: true
        - Name: ObserveKnownBadInputs
          Priority: 3
          OverrideAction:
            Count: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ResourcePrefix}-known-bad-inputs"
            SampledRequestsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-cloudfront-waf"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Application
          Value: sa-briefing-generator
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation
        - Key: Repository
          Value: aadams35/pilarprep-aws
        - Key: DataClassification
          Value: demo


  FrontendResponseHeaders:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${ResourcePrefix}-response-headers"
      AutoPublish: true
      FunctionConfig:
        Comment: Adds CSP, HSTS, and browser security headers.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var response = event.response;
          var headers = response.headers;
          headers["content-security-policy"] = { value: "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://${JobsApiOriginDomainName} https://${CognitoLoginDomainName} https://cognito-identity.${AWS::Region}.amazonaws.com https://*.s3.amazonaws.com https://*.s3.${AWS::Region}.amazonaws.com; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" };
          headers["strict-transport-security"] = { value: "max-age=31536000; includeSubDomains" };
          headers["x-content-type-options"] = { value: "nosniff" };
          headers["x-frame-options"] = { value: "SAMEORIGIN" };
          headers["referrer-policy"] = { value: "strict-origin-when-cross-origin" };
          headers["x-xss-protection"] = { value: "1; mode=block" };
          return response;
        }

  FrontendRequestRouter:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${ResourcePrefix}-request-router"
      AutoPublish: true
      FunctionConfig:
        Comment: Routes SPA paths and removes the protected API prefix.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri || "/";
          if (uri.indexOf("/api/") === 0) {
            request.uri = uri.substring(4);
            return request;
          }
          if (
            uri === "/" ||
            (uri.indexOf(".") === -1 && uri.indexOf("/api") !== 0)
          ) {
            request.uri = "/index.html";
          }
          return request;
        }

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${ProjectName} ${EnvironmentName} static frontend"
        WebACLId: !If
          - HasWebAcl
          - !Ref WebACLId
          - !GetAtt ManagedDemoWebAcl.Arn
        Enabled: true
        Aliases: !If
          - HasCustomDomain
          - [!Ref CustomDomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
        HttpVersion: http2and3
        DefaultRootObject: index.html
        PriceClass: !If [HasPriceClass, !Ref CloudFrontPriceClass, !Ref "AWS::NoValue"]
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - !If
            - HasApiOrigin
            - Id: JobsApiOrigin
              DomainName: !Ref JobsApiOriginDomainName
              OriginCustomHeaders:
                - HeaderName: X-PilarPrep-Origin-Verify
                  HeaderValue: !Sub "{{resolve:secretsmanager:${ApiOriginVerificationSecretArn}:SecretString}}"
              CustomOriginConfig:
                HTTPPort: 80
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
                OriginReadTimeout: 30
                OriginKeepaliveTimeout: 5
                OriginSSLProtocols: [TLSv1.2]
            - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FrontendRequestRouter.FunctionARN
            - EventType: viewer-response
              FunctionARN: !GetAtt FrontendResponseHeaders.FunctionARN
        CacheBehaviors: !If
          - HasApiOrigin
          - - PathPattern: /api/*
              TargetOriginId: JobsApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods:
                - DELETE
                - GET
                - HEAD
                - OPTIONS
                - PATCH
                - POST
                - PUT
              CachedMethods:
                - GET
                - HEAD
                - OPTIONS
              Compress: true
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt FrontendRequestRouter.FunctionARN
                - EventType: viewer-response
                  FunctionARN: !GetAtt FrontendResponseHeaders.FunctionARN
          - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-cloudfront-web"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Application
          Value: sa-briefing-generator
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: cloudformation
        - Key: Repository
          Value: aadams35/pilarprep-aws
        - Key: DataClassification
          Value: demo

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub "${FrontendBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  ResourceNamePrefix:
    Description: Name prefix used in tags and safe display names.
    Value: !Ref ResourcePrefix
  FrontendBucketName:
    Description: S3 bucket containing the static frontend.
    Value: !Ref FrontendBucket
  CloudFrontDistributionId:
    Description: CloudFront distribution ID.
    Value: !Ref FrontendDistribution
  CloudFrontWebAclArn:
    Description: Web ACL attached to the public CloudFront distribution.
    Value: !If [HasWebAcl, !Ref WebACLId, !GetAtt ManagedDemoWebAcl.Arn]
  CloudFrontDomainName:
    Description: CloudFront distribution domain name.
    Value: !GetAtt FrontendDistribution.DomainName
  FrontendUrl:
    Description: HTTPS URL for the AWS-hosted PilarPrep frontend.
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  CustomFrontendUrl:
    Condition: HasCustomDomain
    Description: HTTPS custom-domain URL for PilarPrep.
    Value: !Sub "https://${CustomDomainName}"
  WorkspaceApiUrl:
    Condition: HasApiOrigin
    Description: CloudFront/WAF protected base URL for authenticated workspace API calls.
    Value: !If
      - HasCustomDomain
      - !Sub "https://${CustomDomainName}/api"
      - !Sub "https://${FrontendDistribution.DomainName}/api"
