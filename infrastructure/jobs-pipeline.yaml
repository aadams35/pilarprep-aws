  JobsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${ResourcePrefix}-jobs-pipeline"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Durable AI queue",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["AWS/SQS", "NumberOfMessagesSent", "QueueName", "${JobQueue.QueueName}", {"label": "Queued"}],
                  [".", "NumberOfMessagesDeleted", ".", ".", {"label": "Completed"}],
                  [".", "ApproximateNumberOfMessagesVisible", "QueueName", "${JobDeadLetterQueue.QueueName}", {"label": "DLQ"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API and worker health",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${JobsApiFunction}", {"label": "API requests"}],
                  [".", "Errors", ".", ".", {"label": "API errors"}],
                  [".", "Invocations", ".", "${AiWorkerFunction}", {"label": "Worker jobs"}],
                  [".", "Errors", ".", ".", {"label": "Worker errors"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "Identity, edge and quota controls",
                "region": "${AWS::Region}",
                "view": "singleValue",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["PilarPrep", "UnauthorizedRequests", "Service", "JobsPipeline", {"label": "Unauthorized"}],
                  [".", "CrossScopeAuthorizationAttempts", ".", ".", {"label": "Cross-scope"}],
                  [".", "UsageQuotaExceeded", ".", ".", {"label": "Quota rejected"}],
                  ["PilarPrep", "JobsApiThrottledRequests", {"label": "API throttled"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 6,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "End-to-end latency p95",
                "region": "${AWS::Region}",
                "view": "singleValue",
                "stat": "p95",
                "period": 300,
                "metrics": [
                  ["PilarPrep", "JobTotalLatencyMs", "Service", "JobsPipeline", {"label": "Total job"}],
                  [".", "JobQueueWaitMs", ".", ".", {"label": "Queue wait"}],
                  [".", "AgentCoreLatencyMs", ".", ".", {"label": "AgentCore"}],
                  ["PilarPrep", "BriefModelLatencyMs", "Service", "BriefFunction", {"label": "Bedrock"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 6,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "Model quality and estimated spend",
                "region": "${AWS::Region}",
                "view": "singleValue",
                "stat": "Sum",
                "period": 86400,
                "metrics": [
                  ["PilarPrep", "BriefEstimatedCostUsd", "Service", "BriefFunction", {"label": "Estimated USD"}],
                  [".", "BriefErrors", ".", ".", {"label": "Generation failures"}],
                  [".", "GuardrailInterventions", ".", ".", {"label": "Guardrail interventions"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "AgentCore and authorized RAG",
                "region": "${AWS::Region}",
                "view": "singleValue",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  ["PilarPrep", "AgentCoreFailures", "Service", "JobsPipeline", {"label": "Agent failures"}],
                  [".", "AgentCoreFallbacks", ".", ".", {"label": "Unexpected fallbacks"}],
                  [".", "RagIngestionStatusFailures", ".", ".", {"label": "Ingestion status failures"}],
                  ["PilarPrep", "RagRetrievalFailures", "Service", "AgentCore", {"label": "Retrieval failures"}],
                  [".", "RagCrossScopeAttempts", ".", ".", {"label": "Rejected RAG scope"}]
                ]
              }
            },
            {
              "type": "log",
              "x": 12,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Recent safe job outcomes",
                "region": "${AWS::Region}",
                "query": "SOURCE '${AiWorkerLogGroup}' | fields @timestamp, event, traceId, jobId, tenantHash, action, model, queueWaitMs, modelLatencyMs, totalLatencyMs, retryCount, finalStatus, errorType | sort @timestamp desc | limit 50",
                "view": "table"
              }
            }
          ]
        }

Outputs:
  WorkerMaximumConcurrency:
    Description: Maximum simultaneous worker executions from the shared job queue.
    Value: !Ref WorkerMaximumConcurrency
  JobsApiUrl:
    Description: HTTPS base URL for the unified IAM-authenticated Jobs API.
    Value: !Sub "https://${JobsApi}.execute-api.${AWS::Region}.amazonaws.com"
  WorkspaceUserPoolId:
    Value: !Ref WorkspaceUserPool
  WorkspaceUserPoolClientId:
    Value: !Ref WorkspaceUserPoolClient
  WorkspaceLoginDomain:
    Description: Cognito managed-login domain for verified-email workspace users.
    Value: !Sub "https://${WorkspaceUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  WorkspaceJwtIssuer:
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${WorkspaceUserPool}"

  JobsApiId:
    Value: !Ref JobsApi
  JobsApiFunctionName:
    Value: !Ref JobsApiFunction
  AiWorkerFunctionName:
    Value: !Ref AiWorkerFunction
  AiWorkerRoleArn:
    Description: Role authorized to invoke the PilarPrep AgentCore Runtime.
    Value: !GetAtt AiWorkerRole.Arn
  ApiOriginVerificationSecretArn:
    Description: Secret ARN used by CloudFront and the Jobs API for origin verification.
    Value: !Ref ApiOriginVerificationSecret
  JobQueueUrl:
    Value: !Ref JobQueue
  JobQueueArn:
    Value: !GetAtt JobQueue.Arn
  JobDeadLetterQueueUrl:
    Value: !Ref JobDeadLetterQueue
  JobsDashboardName:
    Value: !Ref JobsDashboard
  OperationsAlertTopicArn:
    Description: SNS topic receiving actionable PilarPrep queue and worker alarms.
    Value: !Ref OperationsAlertTopic
  MeetingEvidenceBucketName:
    Description: Private bucket for malware-scanned audio, expiring full transcripts, and approved RAG evidence.
    Value: !Ref MeetingEvidenceBucket
  MeetingAudioMalwareProtectionPlanId:
    Description: GuardDuty Malware Protection plan scoped to the meeting upload quarantine prefix.
    Value: !If
      - HasMeetingEvidenceBucketName
      - !GetAtt NamedMeetingAudioMalwareProtectionPlan.MalwareProtectionPlanId
      - !GetAtt MeetingAudioMalwareProtectionPlan.MalwareProtectionPlanId
  MeetingAudioMalwareProtectionPlanStatus:
    Description: Current GuardDuty Malware Protection plan status.
    Value: !If
      - HasMeetingEvidenceBucketName
      - !GetAtt NamedMeetingAudioMalwareProtectionPlan.Status
