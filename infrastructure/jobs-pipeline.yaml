  MeetingAudioSecurityOutcomeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions: [!Ref OperationsAlertTopic]
      AlarmName: !Sub "${ResourcePrefix}-meeting-audio-security-outcomes"
      AlarmDescription: A meeting upload was blocked, skipped, or failed malware scanning.
      Metrics:
        - Id: blocked
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: PilarPrep
              MetricName: GuardDutyBlockedScans
              Dimensions:
                - Name: Service
                  Value: JobsPipeline
            Period: 300
            Stat: Sum
        - Id: skipped
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: PilarPrep
              MetricName: GuardDutySkippedScans
              Dimensions:
                - Name: Service
                  Value: JobsPipeline
            Period: 300
            Stat: Sum
        - Id: failed
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: PilarPrep
              MetricName: GuardDutyFailedScans
              Dimensions:
                - Name: Service
                  Value: JobsPipeline
            Period: 300
            Stat: Sum
        - Id: total
          Expression: blocked + skipped + failed
          Label: Abnormal meeting-audio scan outcomes
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-meeting-audio-security-outcomes"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  AiContentSafetyInterventionAlarm:
