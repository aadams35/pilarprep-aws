      AlarmName: !Sub "${ResourcePrefix}-ai-content-safety-interventions"
      AlarmDescription: Bedrock Guardrails blocked an AI request or response.
      Metrics:
        - Id: inputguard
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: PilarPrep
              MetricName: InputGuardrailInterventions
              Dimensions:
                - Name: Service
                  Value: JobsPipeline
            Period: 300
            Stat: Sum
        - Id: outputguard
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: PilarPrep
              MetricName: OutputGuardrailInterventions
              Dimensions:
                - Name: Service
                  Value: JobsPipeline
            Period: 300
            Stat: Sum
        - Id: total
          Expression: inputguard + outputguard
          Label: AI content-safety interventions
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: Name
          Value: !Sub "${ResourcePrefix}-ai-content-safety-interventions"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

